# Alembic 配置。
# 注意：真实连接串不写在这里，由 migrations/env.py 从环境变量 DATABASE_URL 读取，
# 避免把生产库密码提交进版本库。

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 迁移文件名带时间戳，多人协作时不会撞名字
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
